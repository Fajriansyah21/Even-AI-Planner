    <script>
      (function() {
        var isExtensionError = function(msg, src, stack) {
          var str = (String(msg || '') + ' ' + String(src || '') + ' ' + String(stack || '')).toLowerCase();
          return (
            str.indexOf('could not establish connection') !== -1 ||
            str.indexOf('receiving end does not exist') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('safari-extension://') !== -1
          );
        };

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename, event.error && event.error.stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason || {};
          var msg = reason.message || String(reason || '');
          var stack = reason.stack || '';
          if (isExtensionError(msg, '', stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isExtensionError(message, source, error && error.stack)) {
            return true;
          }
          if (origOnError) {
            return origOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
